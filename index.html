<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VMOne Dashboard</title>
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body>
  <header>
    <h1>VMOne Dashboard</h1>
    <nav>
      <button data-tab="flow" class="active">Flow</button>
      <button data-tab="library">Library</button>
      <button data-tab="plan">Plan</button>
      <button data-tab="today">Today</button>
      <button data-tab="week">This Week</button>
      <button data-tab="releases">Releases</button>
      <button data-tab="analytics">Analytics</button>
      <button data-tab="tasks">Tasks</button>
    </nav>
    <div class="progress">
      <span id="week-progress">0%</span> of this week complete
    </div>
  </header>

  <main>
    <section id="flow" class="tab active">
      <h2>Flow</h2>
      <div id="flow-summary"></div>
      <div id="flow-board" class="flow-board"></div>
    </section>

    <section id="today" class="tab"></section>

    <section id="week" class="tab">
      <h2>This Week</h2>
      <div id="week-list"></div>
    </section>

    <section id="library" class="tab">
      <h2>Library</h2>
      <div class="library-tabs">
        <button type="button" data-library="add" class="active">Add Song</button>
        <button type="button" data-library="bulk">Bulk Import</button>
        <button type="button" data-library="list">Songs</button>
      </div>

      <div id="library-add" class="library-panel active">
        <form id="new-song-form">
          <label>
            Paste AI JSON here
            <textarea id="ai-json-paste" rows="8" placeholder="Paste the full JSON the AI returned... if it contains multiple tracks, the first track will be used."></textarea>
          </label>
          <button type="button" id="parse-ai-json">Parse AI JSON</button>

          <hr />

          <label>
            Title
            <input type="text" id="song-title" required />
          </label>
          <label>
            Genres (comma separated)
            <input type="text" id="song-genres" value="rap" />
          </label>
          <label>
            Title Card (big text first 1-2 seconds)
            <input type="text" id="song-title-card" required />
          </label>
          <label>
            Hook (one catchiest line)
            <textarea id="song-hook" rows="2" required></textarea>
          </label>
          <label>
            Lyrics or full chorus
            <textarea id="song-lyrics" rows="6"></textarea>
          </label>
          <label>
            Notes / angle
            <input type="text" id="song-notes" />
          </label>
          <label>
            Monetization
            <select id="song-monetization">
              <option value="monetizable">Monetizable</option>
              <option value="growth-only">Growth-only</option>
            </select>
          </label>
          <label>
            IP / brand note
            <input type="text" id="song-ip" />
          </label>
          <label>
            DistroKid / streaming link
            <input type="url" id="song-distrokid" />
          </label>

          <hr />

          <label>
            Post date
            <input type="date" id="song-date" />
          </label>
          <div class="row platform-choose">
            <label><input type="checkbox" id="platform-youtube-short" checked value="youtube_short"> YouTube Short</label>
            <label><input type="checkbox" id="platform-youtube-lyric" value="youtube_lyric_video"> YouTube Lyric</label>
            <label><input type="checkbox" id="platform-instagram" checked value="instagram_reel"> IG Reel</label>
            <label><input type="checkbox" id="platform-facebook" checked value="facebook_reel"> FB Reel</label>
            <label><input type="checkbox" id="platform-threads" checked value="threads"> Threads</label>
          </div>
          <button type="button" id="suggest-date" class="secondary">Suggest next open date</button>

          <label>
            YouTube Short video ID
            <input type="text" id="song-youtube-short-id" placeholder="e.g. dQw4w9WgXcQ" />
          </label>
          <label>
            YouTube Lyric video ID
            <input type="text" id="song-youtube-lyric-id" placeholder="e.g. dQw4w9WgXcQ" />
          </label>

          <label>
            Release
            <select id="song-release">
              <option value="__new_single__">New single release</option>
              <option value="">No release</option>
            </select>
          </label>

          <button type="submit">Generate Song JSON</button>
        </form>
        <div id="new-song-output" class="output hidden"></div>
      </div>

      <div id="library-bulk" class="library-panel hidden">
        <label>
          Bulk import songs
          <textarea id="bulk-import-text" rows="12" placeholder="Paste one title per line, CSV with header, or a JSON array..."></textarea>
        </label>
        <label>
          Default genre
          <input type="text" id="bulk-import-genre" value="rap" />
        </label>
        <label>
          Default status
          <input type="text" id="bulk-import-status" value="Idea" />
        </label>
        <button type="button" id="bulk-import-btn" class="secondary">Preview import</button>
        <div id="bulk-import-output" class="output hidden"></div>
      </div>

      <div id="library-list" class="library-panel hidden">
        <p class="meta">All songs in the library. Use <strong>Add Song</strong> for one, or <strong>Bulk Import</strong> for many.</p>
        <div id="song-library"></div>
      </div>
    </section>

    <section id="plan" class="tab">
      <h2>Plan</h2>
      <div class="plan-tabs">
        <button type="button" data-plan="release" class="active">New Release</button>
        <button type="button" data-plan="ai-json">From AI JSON</button>
      </div>

      <div id="plan-release" class="plan-panel active">
        <h3>Build a release from the library</h3>
        <label>
          Release type
          <select id="plan-release-type">
            <option value="single">Single</option>
            <option value="ep">EP</option>
            <option value="album">Album</option>
          </select>
        </label>
        <label>
          Concept or story
          <input type="text" id="plan-concept" />
        </label>
        <label>
          Genre
          <input type="text" id="plan-genre" />
        </label>
        <label>
          Moods (comma separated)
          <input type="text" id="plan-moods" />
        </label>
        <label>
          Theme words or imagery
          <input type="text" id="plan-themes" />
        </label>
        <label>
          Reference artists or songs
          <input type="text" id="plan-references" />
        </label>
        <label>
          Avoid / IP restrictions
          <input type="text" id="plan-avoid" />
        </label>

        <div class="song-picker-wrap">
          <div class="song-picker-actions">
            <button type="button" id="plan-select-all">Select all</button>
            <button type="button" id="plan-clear-all" class="secondary">Clear</button>
          </div>
          <div id="plan-song-picker" class="song-picker"></div>
        </div>

        <button type="button" id="generate-release-prompt">Generate AI Prompt</button>
        <div id="plan-release-output" class="output hidden"></div>
      </div>

      <div id="plan-ai-json" class="plan-panel hidden">
        <label>
          Paste full release AI JSON
          <textarea id="plan-ai-json-paste" rows="12" placeholder="Paste the AI's JSON here..."></textarea>
        </label>
        <button type="button" id="plan-parse-release-json" class="secondary">Preview</button>
        <div id="plan-ai-json-output" class="output hidden"></div>
      </div>
    </section>

    <section id="releases" class="tab">
      <h2>Releases</h2>
      <div id="release-list"></div>
    </section>

    <section id="analytics" class="tab">
      <h2>Analytics</h2>
      <div id="analytics-summary"></div>
      <div id="analytics-table"></div>
    </section>

    <section id="tasks" class="tab">
      <h2>Tasks</h2>
      <ul id="task-list"></ul>
    </section>
  </main>

  <footer>
    <p>Linktree: <a href="https://linktr.ee/vmetcone" target="_blank">linktr.ee/vmetcone</a></p>
    <p><a href="#" id="download-json">Download updated content.json</a></p>
  </footer>

  <script src="dashboard.js"></script>
</body>
</html>
